; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
platform = ststm32@17.3.0
framework = arduino
board_build.arduino.flash_layout = 50_50

; Firmware version. Bump to today's date (YYMMDD) on every firmware change.
; version.py turns this into -DFIRMWARE_VERSION, unless a FIRMWARE_VERSION env
; var is set (the GitHub workflows export the tag or dev-<sha>), which wins.
custom_firmware_version = 261106
extra_scripts = pre:version.py

; Trace mode (commissioning only): add raw input samples every N ms to each payload
; as t1-t6/tb arrays. Must be set here in [env] so both cores share the frame layout.
; build_flags = -DTRACE_INTERVAL_MS=200

[env:opta_m7]
board = opta
build_src_filter = +<m7.cpp> +<data_frame.cpp> +<config.cpp> +<status.cpp>
lib_deps =
    https://github.com/hmueller01/pubsubclient3.git
	arduino-libraries/ArduinoModbus@^1.0.9
	arduino-libraries/ArduinoBLE @ ^1.3.6
	bblanchon/ArduinoJson@^7.0.4
	densaugeo/base64@^1.4.0

[env:opta_m4]
board = opta_m4
build_src_filter = +<m4.cpp> +<data_frame.cpp>
; Only count inputs 1-6 that stay high for at least this many ms (default 0 = count all).
; build_flags = -DMIN_HIGH_TIME_MS=300
; (If [env] build_flags is also set, use: build_flags = ${env.build_flags} -DMIN_HIGH_TIME_MS=300)